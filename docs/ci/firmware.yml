name: Firmware and companion checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install platformio==6.2.0 -r macos/requirements.txt
      - name: Embedded panels and firmware
        run: |
          node scripts/build-complete-panel.cjs
          pio run
      - name: Core logic and renderer
        run: |
          sh scripts/test-core.sh
          sh scripts/test-renderer.sh
      - name: Upstream security and media decoder checks
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-multilib
          bash sim/testes.sh 3000
      - name: Mac companion logic
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-development-firmware
          path: .pio/build/smalltv_complete/firmware.bin
          retention-days: 14
